[app]
name = "PaperWeave"
log_level = "INFO"

[api]
host = "0.0.0.0"
port = 18741

[ui]
host = "0.0.0.0"
port = 18742
api_base_url = "http://127.0.0.1:18741"

[timeouts]
health_seconds = 2.0
request_seconds = 10.0
health_poll_seconds = 10.0

[database]
host = "db"
port = 5432
name = "paperweave"
user = "paperweave_app"
password = "change_me"

[storage]
backend = "local"
local_path = "/app/data/files"
s3_endpoint_url = "http://seaweedfs:8333"
s3_region = "us-east-1"
s3_bucket = "paperweave-artifacts"
s3_access_key = "paperweave-local"
s3_secret_key = "change_me_storage_secret"

[deployment]
bind_host = "127.0.0.1"
