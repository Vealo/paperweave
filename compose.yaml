services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PW_DB_NAME:?run through the PaperWeave CLI}
      POSTGRES_USER: ${PW_DB_USER:?run through the PaperWeave CLI}
      POSTGRES_PASSWORD: ${PW_DB_PASSWORD:?run through the PaperWeave CLI}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    command: ["uv", "run", "--frozen", "alembic", "upgrade", "head"]
    environment:
      PAPERWEAVE_CONFIG_FILE: /app/config.toml
    volumes:
      - ${PW_CONFIG_PATH:?run through the PaperWeave CLI}:/app/config.toml:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    command:
      ["uv", "run", "--frozen", "uvicorn", "paperweave.main:app", "--host", "${PW_API_HOST:?}", "--port", "${PW_API_PORT:?}"]
    environment:
      PAPERWEAVE_CONFIG_FILE: /app/config.toml
    volumes:
      - ${PW_CONFIG_PATH:?run through the PaperWeave CLI}:/app/config.toml:ro
    ports:
      - "${PW_BIND_HOST:?}:${PW_API_PORT:?}:${PW_API_PORT:?}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${PW_API_PORT:?}/api/v1/health/live', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    volumes:
      - ${PW_CONFIG_PATH:?run through the PaperWeave CLI}:/app/config.toml:ro
    ports:
      - "${PW_BIND_HOST:?}:${PW_UI_PORT:?}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  test-db:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: paperweave_test
      POSTGRES_USER: paperweave_test
      POSTGRES_PASSWORD: paperweave_test
      PGDATA: /var/lib/postgresql/data/pgdata
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    profiles: [test]
    command: ["uv", "run", "--frozen", "pytest", "-q"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://paperweave_test:paperweave_test@test-db:5432/paperweave_test
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres_data:
    name: ${PW_VOLUME_NAME:?run through the PaperWeave CLI}
