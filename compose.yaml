services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    volumes:
      - seaweedfs_data:/data
      - ${PW_SEAWEED_S3_CONFIG:?run through the PaperWeave CLI}:/etc/seaweedfs/s3.json:ro

  storage-check-seaweedfs:
    image: chrislusf/seaweedfs:4.48
    profiles: [storage-check, test]
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    tmpfs:
      - /data
    volumes:
      - ${PW_SEAWEED_S3_CONFIG:?run through the PaperWeave CLI}:/etc/seaweedfs/s3.json:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PW_DB_NAME:?run through the PaperWeave CLI}
      POSTGRES_USER: ${PW_DB_USER:?run through the PaperWeave CLI}
      POSTGRES_PASSWORD: ${PW_DB_PASSWORD:?run through the PaperWeave CLI}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    command: ["uv", "run", "--frozen", "alembic", "upgrade", "head"]
    environment:
      PAPERWEAVE_CONFIG_FILE: /app/config.toml
    volumes:
      - ${PW_CONFIG_PATH:?run through the PaperWeave CLI}:/app/config.toml:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    command:
      ["uv", "run", "--frozen", "uvicorn", "paperweave.main:app", "--host", "${PW_API_HOST:?}", "--port", "${PW_API_PORT:?}", "--no-access-log"]
    environment:
      PAPERWEAVE_CONFIG_FILE: /app/config.toml
      PW_BIND_HOST: ${PW_BIND_HOST:?}
      PW_UI_PORT: ${PW_UI_PORT:?}
      PW_LOG_LEVEL: ${PW_LOG_LEVEL:-INFO}
      PW_SERVICE: api
    volumes:
      - ${PW_CONFIG_PATH:?run through the PaperWeave CLI}:/app/config.toml:ro
      - paperweave_files:/app/data/files
    ports:
      - "${PW_BIND_HOST:?}:${PW_API_PORT:?}:${PW_API_PORT:?}"
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${PW_API_PORT:?}/api/v1/health/live', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    volumes:
      - ${PW_CONFIG_PATH:?run through the PaperWeave CLI}:/app/config.toml:ro
    environment:
      PW_API_BASE_URL: ${PW_API_BASE_URL:?}
      PW_API_PORT: ${PW_API_PORT:?}
      TZ: UTC
      NGINX_ENVSUBST_FILTER: "^(PW_API_PORT)$"
    ports:
      - "${PW_BIND_HOST:?}:${PW_UI_PORT:?}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/_health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  test-db:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: paperweave_test
      POSTGRES_USER: paperweave_test
      POSTGRES_PASSWORD: paperweave_test
      PGDATA: /var/lib/postgresql/data/pgdata
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    profiles: [test]
    command: ["sh", "-c", "uv run --frozen alembic upgrade head && uv run --frozen alembic upgrade head && uv run --frozen pytest -q"]
    environment:
      PAPERWEAVE_CONFIG_FILE: /app/config.example.toml
      TEST_DATABASE_URL: postgresql+psycopg://paperweave_test:paperweave_test@test-db:5432/paperweave_test
    depends_on:
      test-db:
        condition: service_healthy

  storage-probe:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    profiles: [storage-check, test]
    command: ["uv", "run", "--frozen", "python", "-m", "paperweave.infrastructure.storage.s3_check"]
    environment:
      PW_S3_CHECK_MODE: ${PW_S3_CHECK_MODE:-round-trip}
      PW_S3_CHECK_TIMEOUT: ${PW_S3_CHECK_TIMEOUT:-30}
      PW_S3_ENDPOINT_URL: ${PW_S3_ENDPOINT_URL:?run through the PaperWeave CLI}
      PW_S3_REGION: ${PW_S3_REGION:?run through the PaperWeave CLI}
      PW_S3_BUCKET: ${PW_S3_BUCKET:?run through the PaperWeave CLI}
      PW_S3_ACCESS_KEY: ${PW_S3_ACCESS_KEY:?run through the PaperWeave CLI}
      PW_S3_SECRET_KEY: ${PW_S3_SECRET_KEY:?run through the PaperWeave CLI}
    depends_on:
      storage-check-seaweedfs:
        condition: service_started

volumes:
  postgres_data:
    name: ${PW_VOLUME_NAME:?run through the PaperWeave CLI}
  paperweave_files:
    name: ${PW_FILE_VOLUME_NAME:-paperweave_files}
  seaweedfs_data:
    name: ${PW_SEAWEED_VOLUME_NAME:-paperweave_seaweedfs_data}
