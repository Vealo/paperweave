environment_safety:
  shared_or_production_database_used: false
  paperweave_application_database_changed: false
  persistent_database_snapshot_created: false
  note: >-
    The disposable PostgreSQL tests use tmpfs and do not constitute a persistent local,
    shared, or production migration. A snapshot is required before any separately
    authorized persistent local database migration if prior theme values must be restored.
