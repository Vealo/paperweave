[project]
name = "paperweave"
version = "0.1.0"
description = "Research workspace for evidence-linked scholarly writing"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "pillow>=12.3,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pypdf>=6.21.1,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.14,<3",
    "pytest>=8,<10",
]

[tool.uv]
package = false
